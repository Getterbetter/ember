name: Ember
options:
  bundleIdPrefix: TME
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
    DEAD_CODE_STRIPPING: YES

targets:
  EmberKit:
    type: framework
    platform: macOS
    sources:
      - path: EmberKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(EMBER_BUNDLE_PREFIX).ember.kit
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES

  EmberHelper:
    type: tool
    platform: macOS
    sources:
      - path: EmberHelper
        excludes:
          - "*.plist"
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: EmberHelper
        PRODUCT_BUNDLE_IDENTIFIER: $(EMBER_BUNDLE_PREFIX).ember.helper
        GENERATE_INFOPLIST_FILE: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        SKIP_INSTALL: YES

  Ember:
    type: application
    platform: macOS
    sources:
      - path: Ember
      - path: Shared
    dependencies:
      - target: EmberKit
      - target: EmberHelper
        embed: false
        link: false
    settings:
      base:
        PRODUCT_NAME: Ember
        PRODUCT_BUNDLE_IDENTIFIER: $(EMBER_BUNDLE_PREFIX).ember
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_CFBundleDisplayName: Ember
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSHumanReadableCopyright: "Ember looks after your MagSafe light."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Ember/Ember.entitlements
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
    postBuildScripts:
      - name: Embed privileged helper
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          APP="${TARGET_BUILD_DIR}/${WRAPPER_NAME}"
          mkdir -p "${APP}/Contents/MacOS" "${APP}/Contents/Library/LaunchDaemons"
          cp -f "${BUILT_PRODUCTS_DIR}/EmberHelper" "${APP}/Contents/MacOS/EmberHelper"
          sed "s/__PREFIX__/${EMBER_BUNDLE_PREFIX}/g" "${SRCROOT}/EmberHelper/helper-launchd.plist" \
            > "${APP}/Contents/Library/LaunchDaemons/${EMBER_BUNDLE_PREFIX}.ember.helper.plist"

  EmberKitTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: EmberKitTests
      - path: Shared/SMCKey.swift
    dependencies:
      - target: EmberKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(EMBER_BUNDLE_PREFIX).ember.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Ember:
    build:
      targets:
        Ember: all
        EmberKitTests: [test]
    test:
      targets:
        - EmberKitTests
    run:
      config: Debug
    archive:
      config: Release
